[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-rp-equipment"
version = "0.1.0"
description = "Wearable gear for Evennia RP games: worn lines, and requirements on the wearer's build that grant nothing."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "an0n-b1nary" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]
# evennia-rp-chargen supplies the build that requirements are checked against,
# its lock, and (from 0.3) the change guard that keeps worn gear's requirements
# met. evennia-rp-rules supplies the ruleset that stat requirements name.
dependencies = ["evennia>=6.0", "evennia-rp-rules>=0.1,<0.2", "evennia-rp-chargen>=0.3,<0.4"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/an0n-b1nary/evennia-contribs-staging"
Issues = "https://github.com/an0n-b1nary/evennia-contribs-staging/issues"

# Flat layout: package contents live at the same level as pyproject.toml.
[tool.setuptools]
packages = [
    "evennia_rp_equipment",
    "evennia_rp_equipment.management",
    "evennia_rp_equipment.management.commands",
]

[tool.setuptools.package-dir]
"evennia_rp_equipment" = "."
"evennia_rp_equipment.management" = "management"
"evennia_rp_equipment.management.commands" = "management/commands"
