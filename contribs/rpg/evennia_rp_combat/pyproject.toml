[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-rp-combat"
version = "0.3.0"
description = "Consent-based RP combat with durable tactics, bounded exchanges and host-defined stat sources."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "an0n-b1nary" }]
requires-python = ">=3.12"
dependencies = ["evennia>=6.0", "evennia-links>=0.8.13", "evennia-rp-rules>=0.1,<0.2"]

[project.optional-dependencies]
chargen = ["evennia-rp-chargen>=0.6,<0.7"]
npcs = ["evennia-npcs>=0.3,<0.4"]
scenes = ["evennia-scenes>=0.3"]
posing = ["evennia-posing>=0.1"]
guides = ["evennia-guides>=0.1"]

[project.urls]
Repository = "https://github.com/an0n-b1nary/evennia-contribs-staging"
Issues = "https://github.com/an0n-b1nary/evennia-contribs-staging/issues"

[tool.setuptools]
packages = ["evennia_rp_combat", "evennia_rp_combat.migrations"]

[tool.setuptools.package-dir]
"evennia_rp_combat" = "."
"evennia_rp_combat.migrations" = "migrations"

[tool.setuptools.package-data]
evennia_rp_combat = ["guides/*.md", "PARTNERS.md"]
