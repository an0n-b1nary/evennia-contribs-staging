[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-rp-contest"
version = "0.1.0"
description = "Player-led RP tests, room challenges and private resolution audits for Evennia."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "an0n-b1nary" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]
dependencies = ["evennia>=6.0", "evennia-rp-rules>=0.1,<0.2", "evennia-links>=0.5"]

[project.urls]
Repository = "https://github.com/an0n-b1nary/evennia-contribs-staging"
Issues = "https://github.com/an0n-b1nary/evennia-contribs-staging/issues"

[tool.setuptools]
packages = ["evennia_rp_contest", "evennia_rp_contest.integrations", "evennia_rp_contest.migrations"]

[tool.setuptools.package-dir]
"evennia_rp_contest" = "."
"evennia_rp_contest.integrations" = "integrations"
"evennia_rp_contest.migrations" = "migrations"
