[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-regions"
version = "0.2.0"
description = "Geographic grouping of rooms into named regions, with soft-archive and web views, for Evennia games."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "an0n-b1nary" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]
# Core: models + commands. No web/API deps.
# evennia-links is HARD because shipped models inherit AbstractArchived /
# AbstractAuthoredLink, and commands use EditingMixin.
dependencies = ["evennia>=6.0", "evennia-links>=0.4"]

[project.optional-dependencies]
# [web] enables website views and the DRF API.
web = [
    "djangorestframework>=3.14",
    "django-filter>=23",
]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/an0n-b1nary/evennia-contribs-staging"
Issues = "https://github.com/an0n-b1nary/evennia-contribs-staging/issues"

# Flat layout: package contents live at the same level as pyproject.toml.
[tool.setuptools]
packages = [
    "evennia_regions",
    "evennia_regions.migrations",
    "evennia_regions.integrations",
    "evennia_regions.api",
]

[tool.setuptools.package-dir]
"evennia_regions" = "."
"evennia_regions.migrations" = "migrations"
"evennia_regions.integrations" = "integrations"
"evennia_regions.api" = "api"

[tool.setuptools.package-data]
evennia_regions = ["templates/evennia_regions/*.html"]
