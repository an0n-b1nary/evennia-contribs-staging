[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-rp-crafting"
version = "0.2.0"
description = "Invested Workshops, cosmetic item behaviours and verified maker hallmarks for Evennia."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "an0n-b1nary" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]
dependencies = ["evennia>=6.0", "evennia-links>=0.7,<0.9", "evennia-rp-resources>=0.1.3,<0.2"]

[project.optional-dependencies]
wearable = ["evennia-rp-equipment>=0.1.2,<0.2"]
money = ["evennia-economy>=0.2,<0.3"]
ambient = ["evennia-accessibility>=0.3,<0.4"]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/an0n-b1nary/evennia-contribs-staging"
Issues = "https://github.com/an0n-b1nary/evennia-contribs-staging/issues"

[tool.setuptools]
packages = ["evennia_rp_crafting", "evennia_rp_crafting.migrations"]

[tool.setuptools.package-dir]
"evennia_rp_crafting" = "."
"evennia_rp_crafting.migrations" = "migrations"
