[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-building"
version = "0.2.0"
description = "Reviewed private interiors and individual property rights for Evennia."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "an0n-b1nary" }]
requires-python = ">=3.12"
dependencies = ["evennia>=6.0", "evennia-links>=0.8.3"]

[project.optional-dependencies]
web = ["djangorestframework>=3.14"]

[tool.setuptools]
packages = ["evennia_building", "evennia_building.migrations", "evennia_building.api"]

[tool.setuptools.package-dir]
"evennia_building" = "."
"evennia_building.migrations" = "migrations"
"evennia_building.api" = "api"

[tool.setuptools.package-data]
evennia_building = ["templates/evennia_building/*.html", "guides/*.md"]
