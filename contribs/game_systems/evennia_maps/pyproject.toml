[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-maps"
version = "0.1.0"
description = "A 2D coordinate map of your game's rooms, auto-grown from canonical exits, for Evennia games."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "an0n-b1nary" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]
# Core: models, geometry, command, listeners, room mixin. No web/API deps
# yet — this release is the core phase of a multi-phase extraction; the
# [web] extra lands with the website/API phase.
# evennia-links is HARD: MapPlane inherits AbstractArchived, and apps.py
# wires terrain_changed through connect_on_ready.
dependencies = ["evennia>=6.0", "evennia-links>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/an0n-b1nary/evennia-contribs-staging"
Issues = "https://github.com/an0n-b1nary/evennia-contribs-staging/issues"

# Flat layout: package contents live at the same level as pyproject.toml.
[tool.setuptools]
packages = ["evennia_maps", "evennia_maps.migrations"]

[tool.setuptools.package-dir]
"evennia_maps" = "."
"evennia_maps.migrations" = "migrations"
