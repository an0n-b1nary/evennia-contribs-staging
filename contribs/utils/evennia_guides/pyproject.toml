[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-guides"
version = "0.1.0"
description = "Player guides for Evennia games: Markdown pages with design-insight sidebars, gated on reveal switches, on the web."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "an0n-b1nary" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]
# markdown-it-py: strict CommonMark, raw HTML off. pyyaml (front matter) comes
# with Evennia.
dependencies = ["evennia>=6.0", "markdown-it-py>=3.0,<5"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/an0n-b1nary/evennia-contribs-staging"
Issues = "https://github.com/an0n-b1nary/evennia-contribs-staging/issues"

# Flat layout: package contents live at the same level as pyproject.toml.
[tool.setuptools]
packages = [
    "evennia_guides",
    "evennia_guides.management",
    "evennia_guides.management.commands",
]

[tool.setuptools.package-dir]
"evennia_guides" = "."
"evennia_guides.management" = "management"
"evennia_guides.management.commands" = "management/commands"

[tool.setuptools.package-data]
evennia_guides = [
    "guides/*.md",
    "templates/evennia_guides/*.html",
    "static/evennia_guides/css/*.css",
]
