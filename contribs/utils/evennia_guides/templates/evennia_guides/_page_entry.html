{% comment %}
  One page in a listing. Expects "entry": {page, url, hidden} from GuideMixin.entry.
{% endcomment %}
<a href="{{ entry.url }}">{{ entry.page.title }}</a>
{% if entry.hidden %}<span class="badge badge-warning ml-1">{{ entry.hidden }}</span>{% endif %}
{% if entry.page.summary %}<span class="d-block text-muted small">{{ entry.page.summary }}</span>{% endif %}
