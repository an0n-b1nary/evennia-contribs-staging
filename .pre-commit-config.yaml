# Pre-commit hooks for evennia-contribs-staging.
#
# Setup (one-time, per clone):
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Then commits run the checks below and pushes run the identity/account guard.
# Run manually against everything with: pre-commit run --all-files

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: anonymity-guard
        name: anonymity guard (block forbidden upstream-project references)
        entry: python scripts/anonymity_guard.py
        language: system
        types: [text]

      - id: anonymity-identity-guard
        name: anonymity guard (commit identity)
        entry: python scripts/anonymity_identity_guard.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-templates
        name: django template sweep (compile every template)
        entry: python scripts/check_templates.py
        language: system
        pass_filenames: false
        always_run: true

      - id: anonymity-push-guard
        name: anonymity guard (push remote <-> identity)
        entry: python scripts/anonymity_push_guard.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10  # pin to a known-good version; update intentionally
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
