name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit, ruff and metadata checks
        run: pip install pre-commit ruff==0.16.10 packaging
      - name: Write anonymity patterns from secret
        env:
          ANONYMITY_PATTERNS: ${{ secrets.ANONYMITY_PATTERNS }}
        run: |
          printf '%s\n' "$ANONYMITY_PATTERNS" > .anonymity-patterns
      - name: Run pre-commit on all files
        run: pre-commit run --all-files
      - name: Contrib release metadata checks
        run: |
          python scripts/check_contrib_versions.py
          python scripts/test_check_contrib_versions.py
      - name: Python syntax check
        run: |
          files=$(git ls-files '*.py')
          if [ -n "$files" ]; then
            python -m py_compile $files
          fi
      - name: Push guard and hook installation tests
        run: python scripts/test_anonymity_push_guard.py
      - name: Issue publication guard tests
        run: python scripts/test_file_issue.py
      - name: Contrib installer and partner runner tests
        run: |
          python scripts/test_ci_install_contribs.py
          python scripts/test_ci_run_partner_tests.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Evennia
        # Pinned to the Evennia version the source project runs on.
        # Bump deliberately, in lockstep with the source project's runtime.
        run: pip install evennia==6.0.0
      # The lint job installs no Django, so the pre-commit copy of this hook
      # skips there. Run it here, where Django exists, and require it.
      - name: Django template sweep
        run: python scripts/check_templates.py --require-django
      - name: Template convention tests
        run: python scripts/test_check_templates.py

      - name: Initialize throwaway game directory
        run: evennia --init ci_game < /dev/null
      - name: Install all contribs and register their apps
        run: python scripts/ci_install_contribs.py ci_game
      - name: Installed contrib version parity
        run: python scripts/check_contrib_versions.py --installed
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Run tests
        working-directory: ci_game
        run: python ../scripts/ci_run_tests.py


  partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        calendar: [present, absent]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize throwaway game directory
        run: evennia --init ci_game < /dev/null
      - name: Install all partners
        if: matrix.calendar == 'present'
        run: python scripts/ci_install_contribs.py ci_game
      - name: Install without the optional calendar partner
        if: matrix.calendar == 'absent'
        run: python scripts/ci_install_contribs.py ci_game --exclude evennia-calendar
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Fresh-process partner seams and host-configured maps suite
        run: python scripts/ci_run_partner_tests.py ci_game --calendar ${{ matrix.calendar }}

  resources-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-maps
            excludes: "--exclude evennia-maps"
            absent: "--absent evennia_maps"
          - profile: no-plots
            excludes: "--exclude evennia-plots"
            absent: "--absent evennia_plots"
          - profile: no-social
            excludes: "--exclude evennia-social"
            absent: "--absent evennia_social"
          - profile: no-tracker
            excludes: "--exclude evennia-rptracker"
            absent: "--absent evennia_rptracker"
          - profile: no-economy
            excludes: "--exclude evennia-economy"
            absent: "--absent evennia_economy"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize disposable host
        run: evennia --init ci_game < /dev/null
      - name: Install selected contribs in dependency order
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Resources suite and real partner seams
        run: python scripts/ci_run_resources_tests.py ci_game ${{ matrix.absent }}

  economy-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-resources
            excludes: "--exclude evennia-rp-resources --exclude evennia-rp-crafting"
            absent: "--absent evennia_rp_resources"
          - profile: no-jobs
            excludes: "--exclude evennia-jobs"
            absent: "--absent evennia_jobs"
          - profile: no-equipment
            excludes: "--exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_equipment"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize disposable host
        run: evennia --init ci_game < /dev/null
      - name: Install selected contribs in dependency order
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Economy suite and real partner seams
        run: python scripts/ci_run_economy_tests.py ci_game ${{ matrix.absent }}

  crafting-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-economy
            excludes: "--exclude evennia-economy"
            absent: "--absent evennia_economy"
          - profile: no-equipment
            excludes: "--exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_equipment"
          - profile: no-accessibility
            excludes: "--exclude evennia-accessibility"
            absent: "--absent evennia_accessibility"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize dependency installation host
        run: evennia --init ci_game < /dev/null
      - name: Install selected partners
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Crafting suite and reference seams with verified partner absence
        run: python scripts/ci_run_crafting_tests.py ci_game/crafting_sandbox ${{ matrix.absent }}

  rp-contest-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-scenes
            excludes: "--exclude evennia-scenes"
            absent: "--absent evennia_scenes"
          - profile: no-tracker
            excludes: "--exclude evennia-rptracker"
            absent: "--absent evennia_rptracker"
          - profile: no-chargen
            excludes: "--exclude evennia-rp-chargen --exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_chargen"
          - profile: kernel-only
            excludes: "--exclude evennia-scenes --exclude evennia-rptracker --exclude evennia-rp-chargen --exclude evennia-rp-equipment"
            absent: "--absent evennia_scenes --absent evennia_rptracker --absent evennia_rp_chargen"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize disposable game
        run: evennia --init ci_game < /dev/null
      - name: Install selected partners
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Contest seams with verified partner absence
        run: python scripts/ci_run_rp_contest_tests.py ci_game ${{ matrix.absent }}

  rp-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-scenes
            excludes: "--exclude evennia-scenes"
            absent: "--absent evennia_scenes"
          - profile: no-tracker
            excludes: "--exclude evennia-rptracker"
            absent: "--absent evennia_rptracker"
          - profile: no-xp
            excludes: "--exclude evennia-xp"
            absent: "--absent evennia_xp"
          - profile: no-chargen
            excludes: "--exclude evennia-rp-chargen --exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_chargen --absent evennia_rp_equipment"
          - profile: no-equipment
            excludes: "--exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_equipment"
          - profile: no-contest
            excludes: "--exclude evennia-rp-contest"
            absent: "--absent evennia_rp_contest"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize dependency installation host
        run: evennia --init ci_game < /dev/null
      - name: Install selected partners
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Sandbox gate with verified partner absence
        run: python scripts/ci_run_rp_sandbox_tests.py ci_game/rp_sandbox ${{ matrix.absent }}

  npc-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-scenes
            excludes: "--exclude evennia-scenes"
            absent: "--absent evennia_scenes"
          - profile: no-plots
            excludes: "--exclude evennia-plots"
            absent: "--absent evennia_plots"
          - profile: no-contest
            excludes: "--exclude evennia-rp-contest"
            absent: "--absent evennia_rp_contest"
          - profile: independent
            excludes: "--exclude evennia-scenes --exclude evennia-plots --exclude evennia-rp-contest --exclude evennia-posing --exclude evennia-social --exclude evennia-rptracker --exclude evennia-xp --exclude evennia-rp-chargen --exclude evennia-rp-equipment"
            absent: "--absent evennia_scenes --absent evennia_plots --absent evennia_rp_contest --absent evennia_posing --absent evennia_rptracker --absent evennia_xp --absent evennia_rp_chargen"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize disposable host
        run: evennia --init ci_game < /dev/null
      - name: Install selected contribs in dependency order
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: NPC suite and verified partner seams
        run: python scripts/ci_run_npc_tests.py ci_game ${{ matrix.absent }}

  live-playtest:
    needs: [rp-sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime and live driver
        run: pip install evennia==6.0.0 psutil==7.1.0 playwright==1.62.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install all contribs in dependency order
        run: |
          evennia --init ci_game < /dev/null
          python scripts/ci_install_contribs.py ci_game
      - name: Driver protocol and failure tests
        run: python scripts/test_playtest.py < /dev/null
      - name: Two fresh deterministic/browser and normal RNG passes
        run: |
          python scripts/playtest.py run --suite rp < /dev/null
          python scripts/playtest.py run --suite rp < /dev/null
      - name: Persistent exploratory JSONL session
        run: python scripts/test_playtest_interactive.py < /dev/null
      - name: Sanitized live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-playtest-evidence
          path: .playtest-runs/*/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
