name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit, ruff and metadata checks
        run: pip install pre-commit ruff==0.16.10 packaging
      - name: Write anonymity patterns from secret
        env:
          ANONYMITY_PATTERNS: ${{ secrets.ANONYMITY_PATTERNS }}
        run: |
          printf '%s\n' "$ANONYMITY_PATTERNS" > .anonymity-patterns
      - name: Run pre-commit on all files
        run: pre-commit run --all-files
      - name: Contrib release metadata checks
        run: |
          python scripts/check_contrib_versions.py
          python scripts/test_check_contrib_versions.py
      - name: Python syntax check
        run: |
          files=$(git ls-files '*.py')
          if [ -n "$files" ]; then
            python -m py_compile $files
          fi
      - name: Push guard and hook installation tests
        run: python scripts/test_anonymity_push_guard.py
      - name: Issue publication guard tests
        run: python scripts/test_file_issue.py
      - name: Contrib installer and partner runner tests
        run: |
          python scripts/test_ci_install_contribs.py
          python scripts/test_ci_run_partner_tests.py

  test:
    runs-on: ubuntu-latest
    # Full contrib runs exceed an hour; allow setup and variance on all versions.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Evennia
        # Pinned to the Evennia version the source project runs on.
        # Bump deliberately, in lockstep with the source project's runtime.
        run: pip install evennia==6.0.0
      # The lint job installs no Django, so the pre-commit copy of this hook
      # skips there. Run it here, where Django exists, and require it.
      - name: Django template sweep
        run: python scripts/check_templates.py --require-django
      - name: Template convention tests
        run: python scripts/test_check_templates.py

      - name: Initialize throwaway game directory
        run: evennia --init ci_game < /dev/null
      - name: Install all contribs and register their apps
        run: python scripts/ci_install_contribs.py ci_game
      - name: Installed contrib version parity
        run: python scripts/check_contrib_versions.py --installed
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Run tests
        working-directory: ci_game
        run: python ../scripts/ci_run_tests.py


  lore-items-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-crafting
            excludes: "--exclude evennia-rp-crafting"
            absent: "--absent evennia_rp_crafting"
          - profile: no-lore
            excludes: "--exclude evennia-lore"
            absent: "--absent evennia_lore"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Evennia
        run: pip install evennia==6.0.0
      - name: Initialize throwaway game
        run: evennia --init ci_game < /dev/null
      - name: Install selected partners
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Lore and crafted-item seams with verified partner absence
        run: python scripts/ci_run_lore_item_tests.py ci_game/lore_items ${{ matrix.absent }}

  partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: calendar-present
            args: "--calendar present"
            excludes: ""
          - profile: calendar-absent
            args: "--calendar absent"
            excludes: "--exclude evennia-calendar"
          - profile: building-present
            args: "--building"
            excludes: ""
          - profile: building-no-maps
            args: "--building --absent evennia_maps"
            excludes: "--exclude evennia-maps"
          - profile: building-no-regions
            args: "--building --absent evennia_regions"
            excludes: "--exclude evennia-regions"
          - profile: building-no-jobs
            args: "--building --absent evennia_jobs"
            excludes: "--exclude evennia-jobs --exclude evennia-moderation"
          - profile: building-no-economy
            args: "--building --absent evennia_economy"
            excludes: "--exclude evennia-economy"
          - profile: building-no-social
            args: "--building --absent evennia_social"
            excludes: "--exclude evennia-social"
          - profile: building-core
            args: "--building --absent evennia_maps --absent evennia_regions --absent evennia_jobs --absent evennia_economy --absent evennia_social"
            excludes: "--exclude evennia-maps --exclude evennia-regions --exclude evennia-jobs --exclude evennia-moderation --exclude evennia-economy --exclude evennia-social"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize throwaway game directory
        run: evennia --init ci_game < /dev/null
      - name: Install selected partners in dependency order
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Fresh-process partner seams and host-configured maps suite
        run: python scripts/ci_run_partner_tests.py ci_game ${{ matrix.args }}

  resources-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-maps
            excludes: "--exclude evennia-maps"
            absent: "--absent evennia_maps"
          - profile: no-plots
            excludes: "--exclude evennia-plots"
            absent: "--absent evennia_plots"
          - profile: no-social
            excludes: "--exclude evennia-social"
            absent: "--absent evennia_social"
          - profile: no-tracker
            excludes: "--exclude evennia-rptracker"
            absent: "--absent evennia_rptracker"
          - profile: no-economy
            excludes: "--exclude evennia-economy"
            absent: "--absent evennia_economy"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize disposable host
        run: evennia --init ci_game < /dev/null
      - name: Install selected contribs in dependency order
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Resources suite and real partner seams
        run: python scripts/ci_run_resources_tests.py ci_game ${{ matrix.absent }}

  economy-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-resources
            excludes: "--exclude evennia-rp-resources --exclude evennia-rp-crafting"
            absent: "--absent evennia_rp_resources"
          - profile: no-jobs
            excludes: "--exclude evennia-jobs --exclude evennia-moderation"
            absent: "--absent evennia_jobs"
          - profile: no-building
            excludes: "--exclude evennia-building"
            absent: "--absent evennia_building"
          - profile: no-equipment
            excludes: "--exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_equipment"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize disposable host
        run: evennia --init ci_game < /dev/null
      - name: Install selected contribs in dependency order
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Economy suite and real partner seams
        run: python scripts/ci_run_economy_tests.py ci_game ${{ matrix.absent }}

  crafting-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-economy
            excludes: "--exclude evennia-economy"
            absent: "--absent evennia_economy"
          - profile: no-equipment
            excludes: "--exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_equipment"
          - profile: no-accessibility
            excludes: "--exclude evennia-accessibility"
            absent: "--absent evennia_accessibility"
          - profile: no-building
            excludes: "--exclude evennia-building"
            absent: "--absent evennia_building"
          - profile: no-scenes
            excludes: "--exclude evennia-scenes"
            absent: "--absent evennia_scenes"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize dependency installation host
        run: evennia --init ci_game < /dev/null
      - name: Install selected partners
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Crafting suite and reference seams with verified partner absence
        run: python scripts/ci_run_crafting_tests.py ci_game/crafting_sandbox ${{ matrix.absent }}

  rp-contest-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-scenes
            excludes: "--exclude evennia-scenes"
            absent: "--absent evennia_scenes"
          - profile: no-tracker
            excludes: "--exclude evennia-rptracker"
            absent: "--absent evennia_rptracker"
          - profile: no-chargen
            excludes: "--exclude evennia-rp-chargen --exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_chargen"
          - profile: kernel-only
            excludes: "--exclude evennia-scenes --exclude evennia-rptracker --exclude evennia-rp-chargen --exclude evennia-rp-equipment"
            absent: "--absent evennia_scenes --absent evennia_rptracker --absent evennia_rp_chargen"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize disposable game
        run: evennia --init ci_game < /dev/null
      - name: Install selected partners
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: Contest seams with verified partner absence
        run: python scripts/ci_run_rp_contest_tests.py ci_game ${{ matrix.absent }}

  rp-sandbox:
    runs-on: ubuntu-latest
    # The all-present profile runs the full reference game, not just RP seams.
    # Match the full contrib budget; absent-partner profiles keep a short limit.
    timeout-minutes: ${{ matrix.profile == 'all-present' && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-scenes
            excludes: "--exclude evennia-scenes"
            absent: "--absent evennia_scenes"
          - profile: no-tracker
            excludes: "--exclude evennia-rptracker"
            absent: "--absent evennia_rptracker"
          - profile: no-xp
            excludes: "--exclude evennia-xp"
            absent: "--absent evennia_xp"
          - profile: no-chargen
            excludes: "--exclude evennia-rp-chargen --exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_chargen --absent evennia_rp_equipment"
          - profile: no-equipment
            excludes: "--exclude evennia-rp-equipment"
            absent: "--absent evennia_rp_equipment"
          - profile: no-contest
            excludes: "--exclude evennia-rp-contest"
            absent: "--absent evennia_rp_contest"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize dependency installation host
        run: evennia --init ci_game < /dev/null
      - name: Install selected partners
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Sandbox gate with verified partner absence
        run: python scripts/ci_run_rp_sandbox_tests.py ci_game/rp_sandbox ${{ matrix.absent }}

  crafting-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install only hard partners
        run: |
          pip install evennia==6.0.0
          pip install -e contribs/base_systems/evennia_links
          pip install -e contribs/game_systems/evennia_rp_resources
          pip install -e contribs/game_systems/evennia_rp_crafting
          evennia --init ci_game < /dev/null
      - name: Crafting with verified absence of every optional partner
        run: python scripts/ci_run_crafting_core_tests.py ci_game

  npc-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-present
            excludes: ""
            absent: ""
          - profile: no-scenes
            excludes: "--exclude evennia-scenes"
            absent: "--absent evennia_scenes"
          - profile: no-plots
            excludes: "--exclude evennia-plots"
            absent: "--absent evennia_plots"
          - profile: no-contest
            excludes: "--exclude evennia-rp-contest"
            absent: "--absent evennia_rp_contest"
          - profile: independent
            excludes: "--exclude evennia-scenes --exclude evennia-plots --exclude evennia-rp-contest --exclude evennia-posing --exclude evennia-social --exclude evennia-rptracker --exclude evennia-xp --exclude evennia-rp-chargen --exclude evennia-rp-equipment"
            absent: "--absent evennia_scenes --absent evennia_plots --absent evennia_rp_contest --absent evennia_posing --absent evennia_rptracker --absent evennia_xp --absent evennia_rp_chargen"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Evennia in a fresh environment
        run: pip install evennia==6.0.0
      - name: Initialize disposable host
        run: evennia --init ci_game < /dev/null
      - name: Install selected contribs in dependency order
        run: python scripts/ci_install_contribs.py ci_game ${{ matrix.excludes }}
      - name: Migrate
        working-directory: ci_game
        run: evennia migrate --noinput < /dev/null
      - name: NPC suite and verified partner seams
        run: python scripts/ci_run_npc_tests.py ci_game ${{ matrix.absent }}

  live-playtest:
    needs: [rp-sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime and live driver
        run: pip install evennia==6.0.0 psutil==7.1.0 playwright==1.62.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install all contribs in dependency order
        run: |
          evennia --init ci_game < /dev/null
          python scripts/ci_install_contribs.py ci_game
      - name: Driver protocol and failure tests
        run: python scripts/test_playtest.py < /dev/null
      - name: Two fresh deterministic/browser and normal RNG passes
        run: |
          python scripts/playtest.py run --suite rp < /dev/null
          python scripts/playtest.py run --suite rp < /dev/null
      - name: Combat consent, reload and ordinary-player commands
        run: python scripts/playtest.py run --suite combat --profile normal --no-browser < /dev/null
      - name: Persistent exploratory JSONL session
        run: python scripts/test_playtest_interactive.py < /dev/null
      - name: Sanitized live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-playtest-evidence
          path: .playtest-runs/*/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7


  moderation-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            packages: ""
            absent: "--absent evennia_posing --absent evennia_social --absent evennia_boards --absent evennia_rptracker --absent evennia_npcs --absent evennia_rp_party"
          - profile: social
            packages: "contribs/game_systems/evennia_posing contribs/game_systems/evennia_social"
            absent: "--absent evennia_boards --absent evennia_rptracker --absent evennia_npcs --absent evennia_rp_party"
          - profile: communications
            packages: "contribs/game_systems/evennia_posing contribs/game_systems/evennia_social contribs/game_systems/evennia_boards contribs/game_systems/evennia_rptracker"
            absent: "--absent evennia_npcs --absent evennia_rp_party"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install only hard dependencies and selected communication partners
        run: |
          pip install evennia==6.0.0
          for package in contribs/base_systems/evennia_links contribs/game_systems/evennia_jobs contribs/game_systems/evennia_moderation ${{ matrix.packages }}; do
            pip install -e "$package"
          done
          evennia --init ci_game < /dev/null
      - name: Verified partner absence and file-backed admissions races
        run: python scripts/ci_run_moderation_tests.py ci_game ${{ matrix.absent }} < /dev/null

  combat-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install combat with only its hard partners
        run: |
          pip install evennia==6.0.0
          pip install -e contribs/base_systems/evennia_links
          pip install -e contribs/rpg/evennia_rp_rules
          pip install -e contribs/rpg/evennia_rp_combat
          evennia --init ci_game < /dev/null
          printf "\nINSTALLED_APPS += ['evennia_links', 'evennia_rp_rules', 'evennia_rp_combat']\n" >> ci_game/server/conf/settings.py
      - name: Independent combat with verified physical absence
        run: >-
          python scripts/ci_run_combat_tests.py ci_game
          --absent evennia_rp_chargen --absent evennia_npcs
          --absent evennia_scenes --absent evennia_posing
          --absent evennia_social --absent evennia_accessibility
      - name: Add real NPCs without sheets, Scenes or posing
        run: |
          pip install -e contribs/game_systems/evennia_npcs
          printf "\nINSTALLED_APPS += ['evennia_npcs']\n" >> ci_game/server/conf/settings.py
          python scripts/ci_run_combat_tests.py ci_game --absent evennia_rp_chargen --absent evennia_scenes --absent evennia_posing --absent evennia_social --absent evennia_accessibility

  party-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install hard partners and packaged combat/Party
        run: |
          pip install evennia==6.0.0
          pip install -e contribs/base_systems/evennia_links
          pip install -e contribs/rpg/evennia_rp_rules
          pip wheel --no-deps -w wheels contribs/rpg/evennia_rp_combat
          pip install wheels/evennia_rp_combat-*.whl
          pip wheel --no-deps -w wheels contribs/rpg/evennia_rp_party
          pip install wheels/evennia_rp_party-*.whl
          evennia --init ci_game < /dev/null
          printf "\nINSTALLED_APPS += ['evennia_links', 'evennia_rp_rules', 'evennia_rp_combat', 'evennia_rp_party']\n" >> ci_game/server/conf/settings.py
          cd ci_game && evennia migrate --noinput < /dev/null
      - name: Party/combat without optional packages
        run: >-
          python scripts/ci_run_party_tests.py ci_game
          --absent evennia_rp_contest
          --absent evennia_rp_chargen --absent evennia_npcs
          --absent evennia_scenes --absent evennia_posing
          --absent evennia_social --absent evennia_accessibility
      - name: Create populated retained fight
        run: python scripts/ci_run_party_tests.py ci_game --phase create
      - name: Physically remove Party and resume the retained fight
        run: |
          pip uninstall -y evennia-rp-party
          python scripts/ci_run_party_tests.py ci_game --phase absent --absent evennia_rp_party
      - name: Reinstall Party and restore retained rules
        run: |
          pip install wheels/evennia_rp_party-*.whl
          python scripts/ci_run_party_tests.py ci_game --phase restored
      - name: Add packaged Contest and verify bound response integration
        run: |
          pip wheel --no-deps -w wheels contribs/rpg/evennia_rp_contest
          pip install wheels/evennia_rp_contest-*.whl
          printf "\nINSTALLED_APPS += ['evennia_rp_contest']\n" >> ci_game/server/conf/settings.py
          python scripts/ci_run_party_tests.py ci_game --phase migrate
          python scripts/ci_run_party_tests.py ci_game
      - name: Retain a bound Contest across physical provider removal
        run: |
          python scripts/ci_run_party_tests.py ci_game --phase contest-create
          pip uninstall -y evennia-rp-contest
          python scripts/ci_run_party_tests.py ci_game --phase contest-absent --absent evennia_rp_contest
          pip install wheels/evennia_rp_contest-*.whl
          python scripts/ci_run_party_tests.py ci_game --phase contest-restored
