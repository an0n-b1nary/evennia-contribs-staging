<div class="card">
  <h2 class="card-header h5 text-center mb-0">Recently Connected</h2>
  <ul class="list-group list-group-flush">
    {% for account in accounts_connected_recent %}
    <li class="list-group-item">{{ account.username }} &mdash; <em>{{ account.last_login|timesince }} ago</em></li>
    {% empty %}
    <li class="list-group-item text-muted">No accounts have connected recently. Use Play Online to join the sandbox.</li>
    {% endfor %}
  </ul>
</div>
